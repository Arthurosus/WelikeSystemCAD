# ---------------------------------------------------------------------------
# Alembic configuration file
# ---------------------------------------------------------------------------
[alembic]
# Caminho (relativo a este arquivo) onde ficam env.py e a pasta versions/.
# Se você estiver dentro da pasta backend/ quando rodar os comandos,
# mantenha apenas "alembic".  Caso contrário use %(here)s/alembic.
script_location = alembic

# (opcional) Para não depender do .env você pode definir a URL aqui:
# sqlalchemy.url = mysql+pymysql://root:SENHA@localhost/central_system


# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
